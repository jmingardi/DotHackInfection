name: Pull request checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  source:
    name: Check public sources
    strategy:
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s scripts -p test_release_pipeline.py -v
      - run: python scripts/release.py source --version 0.1.0
